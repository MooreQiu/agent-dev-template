name: CI Gate

# Deterministic quality gate, independent of agent-generated review text: it
# reads the build/test/lint/typecheck commands from .agent/project.json,
# records a machine-verifiable evidence artifact, and enforces test-first
# (red -> green) evidence for code changes -- prose claims are never accepted.
#
# STABLE CHECK NAMES -- do not rename without a migration note:
#   status check context: "CI Gate / quality-gate"
# setup.sh registers it as a required status check when branch protection is
# available; when it is not, scripts/review-verdict.sh enforces the same gate
# (via scripts/ci-gate.sh check) before any merge.
#
# Note: this workflow does not run scripts/bootstrap-env.sh because the gate
# needs no model authentication; ci-gate.sh runs the configured install
# command itself.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: test-first evidence walks the PR commits

      # Single source of truth: the runtime pin comes from .agent/project.json
      # so the provisioned node always matches what scripts/bootstrap-env.sh
      # enforces -- bumping the pin never leaves a stale literal behind.
      - name: Resolve node pin from project config
        id: node_pin
        run: |
          v="$(node -p "JSON.parse(require('fs').readFileSync('.agent/project.json','utf8')).runtime.version")"
          case "$v" in
            '' | *[!0-9]*) echo "::error::unparsable node pin in .agent/project.json: '$v'"; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_pin.outputs.version }}

      - name: Quality gate (configured build/test/lint/typecheck + test-first evidence)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            bash scripts/ci-gate.sh run --base "$BASE"
          else
            bash scripts/ci-gate.sh run
          fi
