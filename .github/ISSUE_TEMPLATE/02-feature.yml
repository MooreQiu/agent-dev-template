name: "✨ 功能建议"
description: 提议一个新功能或增强
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先讲痛点，再讲方案
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] ...
        - [ ] ...
